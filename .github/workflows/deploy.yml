name: Ship It - Next.js CI and Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ship-it-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Typecheck, test and build Next.js
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build Next.js static export
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E smoke tests
        run: npm run test:e2e
      - name: Upload failing browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Verify static export (not legacy v3)
        shell: bash
        run: |
          test -f out/index.html
          test -d out/_next/static
          for route in login register forgot-password reset-password resend-confirmation auth/callback dashboard board tasks calendar insights time-tracking planning sprints; do
            test -f "out/$route/index.html" || { echo "::error::Missing route $route"; exit 1; }
          done
          grep -q '/_next/static/' out/index.html
          if grep -Eiq 'SHIP IT / 3[.]0|Ship It 3[.]0' out/index.html; then
            echo "::error::Legacy Ship It v3 was exported instead of Next.js"
            exit 1
          fi
          echo "Next.js static assets and HTML verified."
      - name: Disable Jekyll processing
        run: touch out/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: Deploy Next.js to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
