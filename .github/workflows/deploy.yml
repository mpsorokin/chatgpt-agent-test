name: Ship It - Next.js CI and Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ship-it-${{ github.sha }}
  cancel-in-progress: false

jobs:
  cancel-stale-runs:
    name: Cancel stale production builds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel older in-progress main workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRunsForRepo({
              owner,repo,branch:'main',status:'in_progress',per_page:50
            });
            for (const run of data.workflow_runs) {
              if (run.id === context.runId || run.name !== 'Ship It - Next.js CI and Pages') continue;
              if (run.head_sha === context.sha) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:run.id});
                core.info('Cancelled outdated run '+run.id);
              } catch (error) {
                core.warning('Could not cancel '+run.id+': '+error.message);
              }
            }
  build:
    name: Typecheck, test and build Next.js
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build Next.js static export
        run: npm run build
      - name: Write public release manifest
        run: |
          node -e "const fs=require('node:fs');fs.writeFileSync('out/release.json',JSON.stringify({version:require('./package.json').version,commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString()},null,2))"
      - name: Install Playwright Chromium
        timeout-minutes: 4
        run: npx playwright install chromium
      - name: Browser E2E smoke tests
        run: npm run test:e2e
      - name: Upload failing browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Verify static export (not legacy v3)
        shell: bash
        run: |
          test -f out/index.html
          test -d out/_next/static
          test -f out/release.json
          node -e "const r=require('./out/release.json');const p=require('./package.json');if(r.version!==p.version||r.commit!==process.env.GITHUB_SHA)process.exit(1)"
          for route in login register forgot-password reset-password resend-confirmation auth/callback dashboard board tasks calendar insights time-tracking planning sprints; do
            test -f "out/$route/index.html" || { echo "::error::Missing route $route"; exit 1; }
          done
          grep -q '/_next/static/' out/index.html
          if grep -Eiq 'SHIP IT / 3[.]0|Ship It 3[.]0' out/index.html; then
            echo "::error::Legacy Ship It v3 was exported instead of Next.js"
            exit 1
          fi
          echo "Next.js static assets and HTML verified."
      - name: Disable Jekyll processing
        run: touch out/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: Deploy Next.js to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify this is still the production HEAD
        shell: bash
        run: |
          CURRENT=$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/main | cut -f1)
          if [ "$CURRENT" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to publish a stale commit"
            exit 1
          fi
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
